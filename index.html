<html>
    
<head>

  <title>To do list</title>

  <style>
    li:hover {
  transform: scale(1.02);
  transition: 0.2s;
}
  

    .b{
  width: 100px;
  position: absolute;
  bottom: 10px;
  right: 10px;
  z-index: -1;

}
span {
  flex: 1;
  text-align: left;
}
li input {
  margin-left: 10px;
}
input {
  padding: 10px;
  font-size: 16px;
}
input[type="checkbox"] {
  transform: scale(1.6);
}
button {
  padding: 8px 12px;
  font-size: 16px;
}
button:hover {
  opacity: 0.85;
}

li:hover {
  transform: scale(1.03);
}
    body {
  margin: 0;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background-image: url(moc.jpeg);
  color: #3b2a26;
}
ul {
  padding: 0;
  margin: 0;
}
    input[type="checkbox"] {
      accent-color: #8d6e63;
      transform: scale(1.5);
    }
.site {
  width: 320px;
}
    input {
      background: #f5e6d3;
    }

    button {
      background: #8d6e63;
      color: #f5e6d3;
      border: none;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    li {
  background: #fff8f0;
  padding: 10px;
  border-radius: 10px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  transition: 0.2s;
  font-family: "Georgia", serif;
}
h1 {
  text-align: center;
  margin-bottom: 15px;
  font-family: "Georgia", serif;
  letter-spacing: 1px;
}
  </style>
</head>

<body>
    
        <div class="site">

<h1>To do list</h1>

<input id="taskInput" placeholder="Enter a task">
<button onclick="add()">Add</button>

<ul id="list"></ul>
        </div>
<script>
    
  
function add() {
   
  let input = document.getElementById("taskInput");
  let text = input.value;

  if (text === "") return;

  let li = document.createElement("li");
  li.style.background = ["#fff8f0", "#fcefe3", "#f9e4d4"][Math.floor(Math.random()*3)];

  let span = document.createElement("span");
  span.innerText = text;

  let checkbox = document.createElement("input");
  checkbox.type = "checkbox";
saveTasks();
  let btn = document.createElement("button");
  btn.innerText = "X";
  btn.onclick = function() {
    li.remove();
    saveTasks();
  
  };
  li.appendChild(span);
  li.appendChild(checkbox);
  li.appendChild(btn);

  document.getElementById("list").appendChild(li);

  input.value = "";
  saveTasks();
}
function saveTasks(){
    let list = document.getElementById("list");
    localStorage.setItem("tasks", list.innerHTML);
}
function loadTasks() {
  let saved = localStorage.getItem("tasks");
  if (saved) {
    document.getElementById("list").innerHTML = saved;
  }
  document.querySelectorAll("li").forEach(li => {
    let checkbox = li.querySelector("input");
    let span = li.querySelector("span");

    if (checkbox && span) {
  if (checkbox.checked) {
    span.style.textDecoration = "line-through";
  }

  checkbox.onchange = function() {
    span.style.textDecoration = this.checked ? "line-through" : "none";
    saveTasks();
  };
}

    let btn = li.querySelector("button");
    if (btn) {
      btn.onclick = function() {
        li.remove();
        saveTasks();
      };
    }
  });
}
document.getElementById("taskInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    add();
  }
});

loadTasks();
</script>
<img src="b.png" class="b">
</body>
    
</html>
