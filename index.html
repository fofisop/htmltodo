<html>
    <center>
<head>

  <title>To do list</title>

  <style>
    .b{
  width: 100px;
  position: absolute;
  bottom: 10px;
  right: 10px;
  back;

}
    body{
         transform: scale(1.3);
  transform-origin: center;
        background-image: url(moc.jpeg);
        color: #3b2a26; 
    }
    input[type="checkbox"] {
      accent-color: #8d6e63;
      transform: scale(1.5);
    }

    input {
      background: #f5e6d3;
    }

    button {
      background: #8d6e63;
      color: #f5e6d3;
      border: none;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px;
    }
  </style>
</head>

<body>
    <br>
    <br> <br> <br> <Br> <br>

<h1>To do list</h1>

<input id="taskInput" placeholder="Enter a task">
<button onclick="add()">Add</button>

<ul id="list"></ul>

<script>
    
  
function add() {
   
  let input = document.getElementById("taskInput");
  let text = input.value;

  if (text === "") return;

  let li = document.createElement("li");

  let span = document.createElement("span");
  span.innerText = text;

  let checkbox = document.createElement("input");
  checkbox.type = "checkbox";

  let btn = document.createElement("button");
  btn.innerText = "X";
  btn.onclick = function() {
    li.remove();
  
  };

  checkbox.onchange = function() {
  span.style.textDecoration = this.checked ? "line-through" : "none";
};
  li.appendChild(span);
  li.appendChild(checkbox);
  li.appendChild(btn);

  document.getElementById("list").appendChild(li);

  input.value = "";
}
</script>
<img src="b.png" class="b">
</body>
    </center>
</html>
